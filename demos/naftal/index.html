<!doctype html>
<html lang="fr" data-genre="drama" data-intensity="0" data-theme="dark" data-tint="naftal">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/demos/naftal/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Naftal · Espace IA interne</title>
    <meta name="theme-color" content="#040b18" />
    <script>
      // Dark first; a viewer who chose print mode gets it before the first paint.
      try { var m = localStorage.getItem("naftal.theme"); if (m === "light" || m === "dark") document.documentElement.dataset.theme = m; } catch (e) {}
    </script>
    <style>
      /* Demo banner. Rendered outside React so no component needs to know
         about it; removed automatically when VITE_DEMO is not set. */
      /* Demo banner, outside React so no component needs to know about it; removed when VITE_DEMO
         is not set. Halation tokens come from the app stylesheet. */
      #demo-banner {
        position: fixed;
        inset-inline: 0;
        bottom: 0;
        z-index: 9999;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem 1.25rem;
        padding: 0.6rem 1rem;
        padding-bottom: calc(0.6rem + env(safe-area-inset-bottom, 0px));
        background: var(--void);
        border-top: 1px solid var(--key);
        color: var(--on-void);
        font: 400 0.8125rem/1.5 var(--font-sans);
      }
      #demo-banner .tag { font-family: var(--font-mono); font-size: var(--fs-micro); letter-spacing: var(--tr-micro); text-transform: uppercase; color: var(--key-ink); }
      #demo-banner code { padding: 0.05em 0.4em; border: 1px solid var(--line-strong); border-radius: var(--r-field); font: 400 0.75rem/1.4 var(--font-mono); color: var(--fg-strong); }
      #demo-banner .spacer { margin-inline-start: auto; }
      #demo-banner a { color: var(--fg-strong); text-decoration: none; }
      #demo-banner a:hover { color: var(--key-ink); }
      #demo-banner button {
        min-height: 2rem;
        padding-inline: 0.9rem;
        font: 500 0.8125rem/1 var(--font-sans);
        color: var(--fg);
        background: transparent;
        border: 1px solid var(--line-strong);
        border-radius: var(--r-control);
        cursor: pointer;
      }
      #demo-banner button:hover { border-color: var(--key-ink); color: var(--fg-strong); }
      /* The banner takes its own row under the app instead of floating over it:
         the app shell is exactly one screen tall (h-dvh), so a floating banner hid
         the sidebar's logout and the bottom of every screen. #root fills what is
         left, the shell fills #root, and the sign-in screens scroll inside it. */
      body.demo { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
      body.demo #root { flex: 1 1 0; min-height: 0; height: auto; overflow-y: auto; }
      body.demo #root .h-dvh { height: 100%; }
      /* z-index back to auto: as a flex item it would still stack, over the phone menu. */
      body.demo #demo-banner { position: static; z-index: auto; flex-shrink: 0; }
    </style>
    <script type="module" crossorigin src="/demos/naftal/assets/index-nUoMeCXV.js"></script>
    <link rel="stylesheet" crossorigin href="/demos/naftal/assets/index-vVvN5J7f.css">
  </head>
  <body>
    <div id="root"></div>

    <div id="demo-banner" data-theme="dark" hidden>
      <span class="tag">Démonstration publique</span>
      <span>
        Données entièrement synthétiques, aucune donnée Naftal. Comptes&nbsp;: <code>Admin</code>,
        <code>com212</code>, <code>cdd208g</code>, n’importe quel mot de passe, code
        <code>482913</code>.
      </span>
      <span class="spacer"></span>
      <a href="../../">Portfolio</a>
      <button type="button" onclick="this.parentElement.remove()">Masquer</button>
    </div>

  </body>
</html>
