<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/demos/naftal/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Naftal — Espace IA Interne</title>
    <style>
      /* Demo banner. Rendered outside React so no component needs to know
         about it; removed automatically when VITE_DEMO is not set. */
      #demo-banner {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 9999;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.4rem 1rem;
        padding: 0.55rem 1rem;
        padding-bottom: calc(0.55rem + env(safe-area-inset-bottom, 0px));
        background: #14181f;
        border-top: 1px solid #c9a227;
        color: #d8dde4;
        font: 500 12.5px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #demo-banner strong { color: #e8b93b; }
      #demo-banner a { color: #e8b93b; }
      #demo-banner .spacer { margin-left: auto; }
      #demo-banner button {
        padding: 0.2rem 0.6rem;
        font: inherit;
        color: inherit;
        background: transparent;
        border: 1px solid #39414d;
        border-radius: 6px;
        cursor: pointer;
      }
      #demo-banner button:hover { border-color: #c9a227; }
      /* The banner takes its own row under the app instead of floating over it:
         the app shell is exactly one screen tall (h-dvh), so a floating banner hid
         the sidebar's logout and the bottom of every screen. #root fills what is
         left, the shell fills #root, and the sign-in screens scroll inside it. */
      body.demo { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
      body.demo #root { flex: 1 1 0; min-height: 0; height: auto; overflow-y: auto; }
      body.demo #root .h-dvh { height: 100%; }
      /* z-index back to auto: as a flex item it would still stack, over the phone menu. */
      body.demo #demo-banner { position: static; z-index: auto; flex-shrink: 0; }
    </style>
    <script type="module" crossorigin src="/demos/naftal/assets/index-DUO-V9sU.js"></script>
    <link rel="stylesheet" crossorigin href="/demos/naftal/assets/index-DQYhA0u2.css">
  </head>
  <body>
    <div id="root"></div>

    <div id="demo-banner" hidden>
      <span>
        <strong>Démonstration publique</strong> — données entièrement synthétiques,
        aucune donnée Naftal. Comptes&nbsp;: <code>Admin</code>, <code>com212</code>,
        <code>cdd208g</code> — mot de passe quelconque, code OTP
        <code>482913</code>.
      </span>
      <span class="spacer"></span>
      <a href="../../">← Portfolio</a>
      <button type="button" onclick="this.parentElement.remove()">Masquer</button>
    </div>

  </body>
</html>
